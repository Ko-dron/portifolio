<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card</title>
<!-- Source for public/og-image.png (1200×630). Edit, then run `npm run cv`. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: radial-gradient(circle at 25% 20%, rgba(223,37,49,0.28), transparent 55%), #161616;
    color: #f2f2f2; font-family: "Segoe UI", Inter, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box;
  }
  .eyebrow { font: 600 22px/1 Consolas, monospace; letter-spacing: 0.22em; text-transform: uppercase; color: #ff5a63; }
  h1 { margin: 28px 0 0; font-size: 84px; line-height: 1; letter-spacing: -0.03em; }
  p { margin: 28px 0 0; font-size: 34px; color: #bdbdbd; max-width: 900px; line-height: 1.3; }
  .foot { margin-top: 48px; font-size: 22px; color: #8a8a8a; }
</style>
</head>
<body>
  <div class="eyebrow">Cybersecurity · AI</div>
  <h1>Stanley Ansong</h1>
  <p>Securing systems, and building AI that holds up under pressure.</p>
  <div class="foot">IT Student · KNUST · Kumasi, Ghana</div>
</body>
</html>
